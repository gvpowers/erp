<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcode Label - {{ product.name }}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#fff;display:flex;justify-content:center;padding:20px;}
.label{width:300px;border:2px solid #111;padding:12px;text-align:center;}
.label__brand{font-size:10px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#555;margin-bottom:4px;}
.label__name{font-size:13px;font-weight:700;color:#111;margin-bottom:6px;line-height:1.2;}
.label__barcode{margin:6px 0;}
.label__barcode img{width:100%;height:auto;max-height:60px;}
.label__meta{display:flex;justify-content:space-between;font-size:9px;color:#555;margin-top:4px;border-top:1px dashed #ccc;padding-top:4px;}
.label__price{font-size:14px;font-weight:800;color:#111;margin-top:4px;}
.label__sku{font-size:9px;color:#888;}
@media print{
    body{padding:0;}
    .no-print{display:none!important;}
    .label{border:1px solid #000;}
}
</style>
</head>
<body>
<div class="no-print" style="position:fixed;top:10px;right:10px;z-index:999;">
    <button onclick="window.print()" style="padding:8px 16px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;">Print Label</button>
</div>
<div class="label">
    <div class="label__brand">GV POWERS</div>
    <div class="label__name">{{ product.name }}</div>
    {% if product.sku %}
    <div class="label__sku">SKU: {{ product.sku }}</div>
    {% endif %}
    {% if barcode_url %}
    <div class="label__barcode">
        <img src="{{ barcode_url }}" alt="Barcode">
    </div>
    {% else %}
    <div style="padding:8px;color:#999;font-size:10px;">No barcode assigned</div>
    {% endif %}
    <div class="label__price">Rs. {{ "%.2f"|format(product.selling_price) }}</div>
    <div class="label__meta">
        <span>{{ product.hsn or '' }}</span>
        <span>{{ product.barcode or '' }}</span>
    </div>
</div>
</body>
</html>
